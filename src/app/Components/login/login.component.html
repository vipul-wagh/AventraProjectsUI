<div class="login-container">
  <div class="login-box">
    <h2>Login</h2>

    <input
      type="text"
      placeholder="Enter Username"
      [(ngModel)]="user.UserName">

    <input
      type="password"
      placeholder="Enter Password"
      [(ngModel)]="user.Password">

    <button (click)="login()">Login</button>
  </div>
</div>
