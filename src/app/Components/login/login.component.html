<div class="login-container">

  <!-- Left Section -->
  <div class="left-section">

    <h1>VIWA Interior</h1>

    <h2>Welcome Back</h2>

    <p>
      Sign in to manage projects, track referrals, and explore
      premium interior design solutions crafted for your dream spaces.
    </p>

  </div>

  <!-- Right Section -->
  <div class="right-section">

    <div class="login-box">

      <h3>Login</h3>

      <p>Enter your account details</p>

      <input
        type="text"
        placeholder="Enter Username"
        [(ngModel)]="user.UserName">

      <input
        type="password"
        placeholder="Enter Password"
        [(ngModel)]="user.Password">

      <button (click)="login()">
        Login
      </button>

    </div>

  </div>

</div>
