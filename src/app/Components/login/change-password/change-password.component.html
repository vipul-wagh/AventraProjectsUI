<div class="container">

<div class="card">

<h2>Change Password</h2>

<p>Please change your default password.</p>

<form (ngSubmit)="changePassword()">

<div>

<label>New Password</label>

<input
type="password"
name="newPassword"
[(ngModel)]="password.newPassword"
required>

</div>

<div>

<label>Confirm Password</label>

<input
type="password"
name="confirmPassword"
[(ngModel)]="password.confirmPassword"
required>

</div>

<button type="submit">

Update Password

</button>

</form>

</div>

</div>
