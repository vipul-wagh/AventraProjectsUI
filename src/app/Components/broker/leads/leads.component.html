<div class="table-container">

    <table class="table">

        <thead>
            <tr>
                <th>Client ID</th>
                <th>Client Name</th>
                <th>Mobile</th>
                <th>Location</th>
                <th>Property</th>
                <th>Status</th>
                <th>Project Value</th>
                <th>Lead Date</th>
            </tr>
        </thead>

        <tbody>

            <tr *ngFor="let lead of leads">
                <td>{{lead.id}}</td>
                <td>{{lead.clientName}}</td>
                <td>{{lead.clientMobile}}</td>
                <td>{{lead.projectLocation}}</td>
                <td>{{lead.propertyType}}</td>
                <td>{{lead.status}}</td>
                <td>₹ {{lead.projectValue | number}}</td>
                <td>{{lead.leadDate | date:'dd/MM/yyyy'}}</td>

            </tr>

            <tr *ngIf="leads.length === 0">
                <td colspan="7" class="text-center">
                    No leads found.
                </td>
            </tr>

        </tbody>

    </table>

</div>
