<div class="registration-container">

    <!-- Left Section -->
    <div class="left-section">

        <h1>VIWA Interior</h1>

        <h2>Create Your Account</h2>

        <p>
            Join VIWA Interior and experience a seamless way to manage
            projects, referrals, and premium interior design services.
            Register today and start your journey with us.
        </p>

    </div>

    <!-- Right Section -->
    <div class="right-section">

        <div class="register-box">

            <h3>Registration</h3>

            <p>Create your new account</p>

            <!-- First Name -->
            <div class="form-group">

                <label>First Name</label>

                <input
                    type="text"
                    [(ngModel)]="user.UserName"
                    name="UserName"
                    placeholder="Enter First Name"
                    required>

            </div>

            <!-- Last Name -->
            <div class="form-group">

                <label>Last Name</label>

                <input
                    type="text"
                    [(ngModel)]="user.LastName"
                    name="LastName"
                    placeholder="Enter Last Name"
                    required>

            </div>

            <!-- Email -->
            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    [(ngModel)]="user.Email"
                    name="Email"
                    placeholder="Enter Email"
                    required>

            </div>

            <!-- Mobile Number -->
            <div class="form-group">

                <label>Mobile Number</label>

                <input
                    type="text"
                    [(ngModel)]="user.MobileNumber"
                    name="MobileNumber"
                    placeholder="Enter Mobile Number"
                    maxlength="10"
                    required>

            </div>

            <!-- Address -->
            <div class="form-group">

                <label>Address</label>

                <textarea
                    [(ngModel)]="user.Address"
                    name="Address"
                    placeholder="Enter Address"
                    rows="2"
                    required>
                </textarea>

            </div>

            <!-- Password -->
          <div class="form-group">

    <label>Password</label>

    <div class="password-wrapper">

        <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="user.Password"
            name="Password"
            placeholder="Enter Password"
            required>

        <i
            class="fa"
            [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
            (click)="showPassword = !showPassword">
        </i>

    </div>

</div>

            <!-- User Type -->
            <div class="form-group">

                <label>User Type</label>

                <select
                    [(ngModel)]="user.UserTypeId"
                    name="UserTypeId"
                    required>

                    <option [ngValue]="0">
                        -- Select User Type --
                    </option>

                    <option
                        *ngFor="let type of userTypes"
                        [ngValue]="type.id">

                        {{ type.typeName }}

                    </option>

                </select>

            </div>

            <button (click)="register()">
                Register
            </button>

        </div>

    </div>

</div>
